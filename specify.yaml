# ── APPLICATION PROFILE ───────────────────────────────────────────────────────
application:
  type: "rag-pipeline"          # rag-pipeline | agent | classifier |
                                # fine-tuned-model | multimodal | other
  description: |
    A retrieval-augmented generation system that answers customer queries
    using a private knowledge base, cites source documents in every response,
    redacts PII before logging, and escalates to a human agent when confidence
    falls below threshold.
  deployment: "cloud"           # cloud | on-prem | edge | hybrid
  interaction_mode: "synchronous"  # synchronous | async | batch
  end_users: "external-customers"  # internal | external-customers | both


# ── FUNCTIONAL REQUIREMENTS ───────────────────────────────────────────────────
# Priority follows MoSCoW: must-have | should-have | could-have | wont-have
# Type: functional | non-functional | safety | compliance | performance
#
# body: free-form text — plain prose, markdown, bullet points, tables, whatever
# the author needs. No enforced structure. This field maps directly to the
# "Description" column in the exported requirements.csv.

requirements:
  - id: "REQ-001"
    title: "Citation of source documents"
    type: "functional"
    priority: "must-have"
    body: |
      Every generated response must include inline citations referencing the
      specific document chunks retrieved during the query.

      Each response includes ≥1 citation in [source: <doc_id>] format.
      Citations must resolve to a real document in the knowledge base.
      Responses with no retrieved chunks return a fallback message — not a
      hallucinated answer.
    linked_to: []
    tags: ["hallucination", "grounding"]

  - id: "REQ-002"
    title: "PII redaction before logging"
    type: "safety"
    priority: "must-have"
    body: |
      User inputs and model outputs must be scanned for PII (names, emails,
      phone numbers, account numbers) and redacted before being written to
      any log store or analytics pipeline.

      Redacted fields should be replaced with [REDACTED:<type>] tokens.
      Scanner must achieve ≥99% recall on the PII test suite.
    linked_to: ["REQ-005"]
    tags: ["privacy", "pii", "logging"]

  - id: "REQ-003"
    title: "Human escalation on low confidence"
    type: "functional"
    priority: "must-have"
    body: |
      When the model's confidence score (or retrieval score) falls below a
      configurable threshold, the system must route the conversation to a
      human support agent rather than return a low-quality answer.

      The escalation threshold must be configurable without a code deployment.
      Users receive a plain-language handoff message before transfer.
    linked_to: []
    tags: ["human-in-the-loop", "fallback"]

  - id: "REQ-004"
    title: "Response latency under load"
    type: "performance"
    priority: "must-have"
    body: |
      End-to-end response time (retrieval + generation) must meet SLA targets
      at production traffic levels.

      p50 ≤ 1.5s and p99 ≤ 4s at 500 concurrent users.
      No degradation in citation quality under load.
    linked_to: []
    tags: ["latency", "scalability"]

  - id: "REQ-005"
    title: "Audit log retention"
    type: "compliance"
    priority: "should-have"
    body: |
      Post-redaction conversation logs must be retained for 90 days in
      tamper-evident storage to support compliance audits.

      Logs written to append-only, immutable store. Retention policy enforced
      automatically. Log export available to authorized auditors within 24h.
    linked_to: ["REQ-002"]
    tags: ["audit", "retention", "compliance"]


# ── CANVAS ────────────────────────────────────────────────────────────────────
# Embedded Excalidraw canvas for architecture diagrams, flow diagrams, and
# annotated images. Edited in the Specify UI; stored alongside requirements.
#
# On download, the package zip includes:
#   canvas.excalidraw   — raw file, re-editable in Excalidraw or the Specify UI
#   canvas.png          — flattened export for sharing / embedding in docs
#
# Videos are referenced as external links (Loom, YouTube) and render as
# thumbnails in the canvas rather than stored files.

canvas:
  excalidraw_file: "canvas.excalidraw"   # relative path within package zip
  png_export: "canvas.png"
  external_media:
    - type: "video"
      title: "System architecture walkthrough"
      url: "https://www.loom.com/share/example"
    - type: "video"
      title: "RAG pipeline demo"
      url: "https://www.youtube.com/watch?v=example"


